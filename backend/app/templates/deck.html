<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{project.content.title}}</title><style>{{css|safe}}{% if project.get("aspect_ratio", "16:9") == "16:9" %}@media print{@page{size:240mm 135mm}}{% endif %}</style></head><body><main class="deck">{% for page in project.content.pages %}<article class="slide {{ "portrait" if project.get("aspect_ratio") == "9:16" else "landscape" }}" id="slide-{{loop.index}}"><div class="eyebrow"><span>知识笔记</span><span>{{'%02d' % loop.index}} / {{project.content.pages|length}}</span></div><h1>{{page.title}}</h1><p class="body">{{page.body}}</p><div class="concepts">{% for point in page.highlights %}<div class="concept"><b>{{'%02d' % loop.index}}</b><span>{{point}}</span></div>{% endfor %}</div><footer><span>保持好奇 · 把知识讲明白</span>{% if not loop.last %}<a href="#slide-{{loop.index+1}}">下一页 →</a>{% endif %}</footer></article>{% endfor %}</main><script type="application/json" id="project-data">{{project|tojson}}</script></body></html>
