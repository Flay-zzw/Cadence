<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{project.content.title}}</title><style>{{css|safe}}</style></head><body><main class="deck">{% for page in project.content.pages %}<article class="slide {{page.role}}" id="slide-{{loop.index}}"><div class="eyebrow"><span>CADENCE · SCIENCE NOTES</span><span>{{'%02d' % loop.index}} / {{project.content.pages|length}}</span></div><h1>{{page.title}}</h1><p class="body">{{page.body}}</p><div class="concepts">{% for point in page.highlights %}<div class="concept"><b>{{'%02d' % loop.index}}</b><span>{{point}}</span></div>{% endfor %}</div><div class="orbit" aria-hidden="true"></div><footer><span>保持好奇 · 把知识讲明白</span>{% if not loop.last %}<a href="#slide-{{loop.index+1}}">下一页 →</a>{% endif %}</footer></article>{% endfor %}</main><script type="application/json" id="project-data">{{project|tojson}}</script></body></html>
